<title>Oila va xotin-qizlar qo'mitasi</title>
<style>
  :root{
    --bg:#f3f7f8; --card:#ffffff; --ink:#14232a; --muted:#5d6f77;
    --accent:#0a99b8; --accent-dark:#077c96; --green:#22b33a; --red:#cc1a2b; --line:#dbe6ea;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;justify-content:center;padding:40px 16px 56px}
  .page{width:100%;max-width:420px;text-align:center}
  .logo{display:block;width:100%;max-width:300px;height:auto;margin:0 auto 18px}
  .sub{font-size:14px;color:var(--muted);margin:0 0 24px}
  .strip{display:flex;height:4px;width:120px;margin:0 auto 24px;border-radius:2px;overflow:hidden}
  .strip i{flex:1}
  .links{display:flex;flex-direction:column;gap:12px}
  a.btn{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink);
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:14px 16px;font-weight:600;font-size:15px;transition:transform .15s,border-color .15s}
  a.btn:hover{transform:translateY(-1px);border-color:var(--accent)}
  .ic{width:34px;height:34px;border-radius:10px;flex:none;display:grid;place-items:center;
    color:#fff;font-size:13px;font-weight:700}
  .btn span.t{flex:1;text-align:left}
  .btn span.h{font-size:12px;color:var(--muted);font-weight:500}
  a.btn.site{background:var(--accent);color:#fff;border-color:var(--accent)}
  a.btn.site:hover{background:var(--accent-dark)}
  .site .h{color:#d9f3f9 !important}
  .site .ic{background:#fff !important;color:var(--accent)}
  footer{margin-top:28px;font-size:12px;color:var(--muted)}
</style>
